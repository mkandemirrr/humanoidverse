name: Refresh news

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/fetch_news.mjs
      - name: Commit news.json if it changed
        run: |
          if ! git diff --quiet -- news.json; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add news.json
            git commit -m "data: refresh news.json"
            git push
          else
            echo "No news changes."
          fi
