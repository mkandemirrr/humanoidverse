name: Weekly Robot Spec Verification

on:
  schedule:
    # Her Pazartesi saat 09:00 UTC (12:00 Türkiye)
    - cron: '0 9 * * 1'
  workflow_dispatch: # Manuel tetikleme butonu

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Run Spec Verification
        id: verify
        run: |
          node tools/verify_specs.js | tee output.txt
          MISMATCHES=$(node -e "const r=require('./verification_report.json'); console.log(r.mismatches)")
          echo "mismatches=$MISMATCHES" >> $GITHUB_OUTPUT
      
      - name: Create Issue if Mismatches Found
        if: steps.verify.outputs.mismatches != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('verification_report.json', 'utf8'));
            const body = `## 🤖 Robot Spec Doğrulama Raporu

            **Tarih:** ${report.date}
            **Kontrol edilen:** ${report.checked} robot
            **Fark bulunan:** ${report.mismatches} robot

            ### Düzeltme Gerektiren Robotlar:
            ${report.details.map(d => 
              `#### ${d.robot}\n${d.diffs.join('\n')}\n🔗 [Kaynak](${d.url})`
            ).join('\n\n')}
            
            > Bu issue otomatik olarak haftalık doğrulama tarafından oluşturuldu.`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ ${report.mismatches} robot spec uyumsuzluğu tespit edildi`,
              body: body,
              labels: ['data-verification', 'automated']
            });
      
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: verification_report.json
