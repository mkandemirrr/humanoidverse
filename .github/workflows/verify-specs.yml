name: Weekly Robot Spec Verification
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Spec Verification
        run: node tools/verify_specs.js
